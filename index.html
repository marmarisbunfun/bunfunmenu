<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f5f5f0;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #b22222;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 1rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #menu-container {
            width: 100%;
            max-width: 800px;
        }
        .category-title {
            font-size: 1.5rem;
            color: #222;
            margin: 25px 0 15px 0;
            border-bottom: 2px solid #b22222;
            padding-bottom: 5px;
            text-transform: uppercase;
        }
        .menu-item {
            background: #ffffff;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-details h3 {
            font-size: 1.1rem;
            color: #111;
            margin-bottom: 4px;
        }
        .item-details p {
            font-size: 0.85rem;
            color: #777;
        }
        .item-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #b22222;
            white-space: nowrap;
            margin-left: 15px;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #555;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BUN & FUN</h1>
        <p class="subtitle">Dijital Menü</p>
    </header>

    <div id="menu-container">
        <div class="loading">Menü yükleniyor...</div>
    </div>

    <script>
        // Google Sheets verisini doğrudan okuyan script
        async function loadMenu() {
            try {
                // index.html'in içindeki ham JSON verisini çekiyoruz
                let response = await fetch(window.location.href);
                let text = await response.text();
                
                // Eğer veri dizi formatındaysa parse et
                let rows = JSON.parse(text);
                
                let container = document.getElementById('menu-container');
                container.innerHTML = '';
                
                if (!rows || rows.length < 2) {
                    container.innerHTML = '<div class="loading">Menü içeriği henüz boş.</div>';
                    return;
                }

                // Başlık satırını atlayarak verileri döngüye alıyoruz
                let currentCategory = '';
                let html = '';

                for (let i = 1; i < rows.length; i++) {
                    let row = rows[i];
                    let category = row[0]; // Kategori (TR)
                    let name = row[1];     // Adı (TR)
                    let desc = row[2];     // Açıklama (TR)
                    let price = row[3];    // Fiyat
                    let status = row[4];   // Durum

                    if (!name) continue;

                    // Eğer pasifse veya satır boşsa atla
                    if (status && status.toLowerCase() === 'pasif') continue;

                    if (category !== currentCategory) {
                        currentCategory = category;
                        html += `<div class="category-title">${currentCategory}</div>`;
                    }

                    html += `
                        <div class="menu-item">
                            <div class="item-details">
                                <h3>${name}</h3>
                                <p>${desc || ''}</p>
                            </div>
                            <div class="item-price">${price} TL</div>
                        </div>
                    `;
                }

                container.innerHTML = html;

            } catch (e) {
                console.error(e);
                document.getElementById('menu-container').innerHTML = '<div class="loading">Menü yüklenirken bir hata oluştu. Lütfen sayfayı yenileyin.</div>';
            }
        }

        loadMenu();
    </script>
</body>
</html>
