<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUN & FUN - Dijital Menü</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f5f5f0; color: #333333; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #f5f5f0; padding: 25px 15px; text-align: center; border-bottom: 1px solid #e0e0dc; }
        .header-brand { font-size: 28px; font-weight: 700; color: #c73729; letter-spacing: 1px; margin-bottom: 2px; }
        .slogan { font-family: 'Great Vibes', cursive; font-size: 26px; color: #ee8e00; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; width: 100%; flex-grow: 1; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        #page-language.active { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; }
        
        .lang-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 280px; }
        .lang-btn { background-color: #ffffff; border: 2px solid #c73729; color: #c73729; padding: 14px 20px; font-size: 17px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: center; gap: 12px; }
        .lang-btn span.flag { font-size: 22px; }
        .lang-btn:hover { background-color: #c73729; color: #ffffff; transform: translateY(-2px); }
        
        .back-bar { margin-bottom: 20px; }
        .back-btn { background: none; border: none; color: #c73729; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; color: #222; }
        
        .category-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .category-card { background-color: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); cursor: pointer; font-size: 18px; font-weight: 600; color: #333; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; border-left: 5px solid #c73729; }
        .category-card:hover { transform: scale(1.01); }
        
        .product-list { display: flex; flex-direction: column; gap: 12px; }
        .product-card { background-color: #ffffff; border-radius: 12px; padding: 12px; display: flex; gap: 15px; align-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-2px); }
        
        .product-thumb { width: 75px; height: 75px; border-radius: 8px; object-fit: cover; background-color: #eaeaea; flex-shrink: 0; }
        .product-thumb-placeholder { width: 75px; height: 75px; border-radius: 8px; background-color: #e5e5e0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; color: #777; font-weight: 600; padding: 4px; flex-shrink: 0; }
        
        .product-info { flex-grow: 1; }
        .product-name { font-size: 16px; font-weight: 600; color: #222; margin-bottom: 2px; }
        .product-desc-preview { font-size: 13px; color: #666; margin-bottom: 6px; line-height: 1.4; }
        .product-price { font-size: 15px; font-weight: 700; color: #c73729; }
        
        .detail-box { background-color: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .detail-img { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; background-color: #eaeaea; margin-bottom: 20px; }
        .detail-img-placeholder { width: 100%; height: 200px; border-radius: 12px; background-color: #e5e5e0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #666; font-weight: 600; margin-bottom: 20px; }
        .detail-title { font-size: 24px; font-weight: 700; color: #222; margin-bottom: 12px; }
        .detail-desc { font-size: 16px; color: #666; margin-bottom: 20px; line-height: 1.6; }
        .detail-price { font-size: 26px; font-weight: 700; color: #c73729; }
        
        .loading-screen { text-align: center; padding: 40px; font-size: 16px; color: #666; }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">BUN & FUN BURGER</div>
        <div class="slogan">fun in every bite</div>
    </header>

    <div class="container">
        <!-- 1. DİL SEÇİMİ SAYFASI -->
        <div id="page-language" class="page active">
            <div class="lang-buttons">
                <button class="lang-btn" onclick="setLanguage('tr')"><span class="flag">🇹🇷</span> Türkçe</button>
                <button class="lang-btn" onclick="setLanguage('en')"><span class="flag">🇬🇧</span> English</button>
                <button class="lang-btn" onclick="setLanguage('ru')"><span class="flag">🇷🇺</span> Русский</button>
            </div>
        </div>

        <!-- 2. KATEGORİLER SAYFASI -->
        <div id="page-categories" class="page">
            <div class="back-bar"><button class="back-btn" onclick="showPage('page-language')">← <span id="txt-back-lang">Dil Seçimi</span></button></div>
            <div class="section-title" id="txt-cat-title">Kategoriler</div>
            <div id="category-container" class="category-grid">
                <div class="loading-screen">Menü yükleniyor...</div>
            </div>
        </div>

        <!-- 3. ÜRÜNLER LİSTESİ SAYFASI -->
        <div id="page-products" class="page">
            <div class="back-bar"><button class="back-btn" onclick="showPage('page-categories')">← <span id="txt-back-cat">Kategoriler</span></button></div>
            <div class="section-title" id="product-section-title">Ürünler</div>
            <div id="product-container" class="product-list"></div>
        </div>

        <!-- 4. TEKİL ÜRÜN DETAY SAYFASI -->
        <div id="page-detail" class="page">
            <div class="back-bar"><button class="back-btn" onclick="backToProducts()"><span id="txt-back-prod">← Ürünlere Dön</span></button></div>
            <div class="detail-box">
                <div id="detail-img-container"></div>
                <h2 id="detail-title" class="detail-title"></h2>
                <p id="detail-desc" class="detail-desc"></p>
                <div id="detail-price" class="detail-price"></div>
            </div>
        </div>
    </div>

    <script>
        let menuData = { tr: [], en: [], ru: [] };
        let currentLang = 'tr';
        let currentCatIndex = 0;

        const uiTexts = {
            tr: { backLang: "Dil Seçimi", backCat: "Kategoriler", backProd: "← Ürünlere Dön", catTitle: "Kategoriler", soonText: "Görsel Hazırlanıyor" },
            en: { backLang: "Language", backCat: "Categories", backProd: "← Back to Products", catTitle: "Categories", soonText: "Photo Coming Soon" },
            ru: { backLang: "Язык", backCat: "Категории", backProd: "← Назад к товарам", catTitle: "Категории", soonText: "Фото скоро будет" }
        };

        function parseCSV(text) {
            let lines = [];
            let row = [""];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i], next = text[i + 1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push("");
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [""];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== "") { lines.push(row); }
            return lines;
        }

        function getImagePath(customImg, productName) {
            if (customImg && customImg.trim() !== "") {
                return customImg.trim();
            }
            if (!productName) return "";
            let trMap = {'İ': 'i', 'I': 'i', 'ı': 'i', 'Ş': 's', 'ş': 's', 'Ğ': 'g', 'ğ': 'g', 'Ü': 'u', 'ü': 'u', 'Ö': 'o', 'ö': 'o', 'Ç': 'c', 'ç': 'c'};
            let clean = productName.split('').map(char => trMap[char] || char).join('');
            clean = clean.toLowerCase().replace(/[^a-z0-9]/g, '');
            return "images/" + clean + ".jpg";
        }

        async function fetchMenu() {
            try {
                const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdNmjIQYSsH6Wt1yluSA7KvQhyUhJCpPXB8PKPH2sLF-fxe-vfhGCdw0KVzmWVquyIvcg8iIE_KZa9/pub?output=csv&t=" + new Date().getTime();
                let res = await fetch(csvUrl);
                let text = await res.text();
                let rows = parseCSV(text);

                if (!rows || rows.length < 2) return;

                let trMap = {}, enMap = {}, ruMap = {};

                for (let i = 1; i < rows.length; i++) {
                    let r = rows[i];
                    if (!r || r.length < 4) continue;

                    // Durum kontrolü: Eğer "pasif" yazılmışsa ürünü atla. "satışta" veya boşsa göster!
                    let status = (r[4] || "").toString().toLowerCase().trim();
                    if (status === 'pasif' || status === 'passive' || status === '0') continue;

                    let cTr = (r[0] || "").toString().trim();
                    let nTr = (r[1] || "").toString().trim();
                    if (!cTr || !nTr) continue;

                    let dTr = (r[2] || "").toString().trim();
                    let price = (r[3] || "").toString().trim();
                    if (price && !price.includes("TL") && !price.includes("₺")) price += " TL";
                    
                    let img = getImagePath(r[5], nTr);

                    let cEn = (r[6] || "").toString().trim() || cTr;
                    let nEn = (r[7] || "").toString().trim() || nTr;
                    let dEn = (r[8] || "").toString().trim() || dTr;

                    let cRu = (r[9] || "").toString().trim() || cTr;
                    let nRu = (r[10] || "").toString().trim() || nTr;
                    let dRu = (r[11] || "").toString().trim() || dTr;

                    if (!trMap[cTr]) trMap[cTr] = [];
                    trMap[cTr].push({ name: nTr, desc: dTr, price: price, image: img });

                    if (!enMap[cEn]) enMap[cEn] = [];
                    enMap[cEn].push({ name: nEn, desc: dEn, price: price, image: img });

                    if (!ruMap[cRu]) ruMap[cRu] = [];
                    ruMap[cRu].push({ name: nRu, desc: dRu, price: price, image: img });
                }

                const toArr = (obj) => Object.keys(obj).map(k => ({ name: k, products: obj[k] }));

                menuData.tr = toArr(trMap);
                menuData.en = toArr(enMap);
                menuData.ru = toArr(ruMap);
            } catch (e) {
                console.error("Yükleme hatası:", e);
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        async function setLanguage(lang) {
            currentLang = lang;
            await fetchMenu();

            let t = uiTexts[lang];
            document.getElementById('txt-back-lang').innerText = t.backLang;
            document.getElementById('txt-back-cat').innerText = t.backCat;
            document.getElementById('txt-back-prod').innerText = t.backProd;
            document.getElementById('txt-cat-title').innerText = t.catTitle;

            renderCategories();
            showPage('page-categories');
        }

        function renderCategories() {
            let container = document.getElementById('category-container');
            container.innerHTML = '';
            let cats = menuData[currentLang];

            if (!cats || cats.length === 0) {
                container.innerHTML = `<div class="loading-screen">Kategori bulunamadı veya bağlantı kurulamadı.</div>`;
                return;
            }

            cats.forEach((cat, index) => {
                let card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `<span>${cat.name}</span> <span>→</span>`;
                card.onclick = () => openCategory(index);
                container.appendChild(card);
            });
        }

        function openCategory(catIndex) {
            currentCatIndex = catIndex;
            let cat = menuData[currentLang][catIndex];
            let t = uiTexts[currentLang];
            document.getElementById('product-section-title').innerText = cat.name;

            let container = document.getElementById('product-container');
            container.innerHTML = '';

            cat.products.forEach(prod => {
                let card = document.createElement('div');
                card.className = 'product-card';
                
                let imgHtml = prod.image ? 
                    `<img class="product-thumb" src="${prod.image}" alt="${prod.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'product-thumb-placeholder\'>${t.soonText}</div>';">` : 
                    `<div class="product-thumb-placeholder">${t.soonText}</div>`;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="product-info">
                        <div class="product-name">${prod.name}</div>
                        <div class="product-desc-preview">${prod.desc}</div>
                        <div class="product-price">${prod.price}</div>
                    </div>
                `;
                card.onclick = () => openDetail(prod);
                container.appendChild(card);
            });

            showPage('page-products');
        }

        function openDetail(prod) {
            let t = uiTexts[currentLang];
            let imgContainer = document.getElementById('detail-img-container');
            imgContainer.innerHTML = '';

            if (prod.image) {
                let img = document.createElement('img');
                img.className = 'detail-img';
                img.src = prod.image;
                img.alt = prod.name;
                img.onerror = function() {
                    imgContainer.innerHTML = `<div class="detail-img-placeholder">${t.soonText}</div>`;
                };
                imgContainer.appendChild(img);
            } else {
                imgContainer.innerHTML = `<div class="detail-img-placeholder">${t.soonText}</div>`;
            }

            document.getElementById('detail-title').innerText = prod.name;
            document.getElementById('detail-desc').innerText = prod.desc;
            document.getElementById('detail-price').innerText = prod.price;

            showPage('page-detail');
        }

        function backToProducts() {
            openCategory(currentCatIndex);
        }
    </script>
</body>
</html>
